<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASCII Rubik's cube</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #111110;
      }

      /* the cube: a monospace font at line-height 1.1 (that is the
         default aspect the script draws for), sized so its 72
         columns fit the screen */
      [data-ascii-cube] {
        margin: 0;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: min(12px, calc(95vw / 72 / 0.6));
        line-height: 1.1;
        color: #e9e9e6;
      }

      .ascii-cube-accent {
        color: #ffb000;
      }
    </style>
  </head>
  <body>
    <pre data-ascii-cube role="img" aria-label="A Rubik's cube drawn in ASCII characters, turning and solving itself"></pre>
    <script src="ascii-cube.js" defer></script>
  </body>
</html>
